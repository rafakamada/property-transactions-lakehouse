version: 2

models:
  - name: stg_itbi
    description: >-
      Cleaned ITBI transactions across configured years (vars.itbi_years).
      Grain: one row per raw month-sheet transaction row (not a business unique key).
      Renames Portuguese headers via mechanical slugify (accents stripped; stop words
      de/da/do/das/dos dropped); trims empty strings to null; coerces dates and numerics;
      normalizes SQL / IPTU codes / CEP; nulls proporção outside [0, 100]; drops
      header-echo junk rows.
      Column descriptions follow the Prefeitura field dictionary on the workbook
      EXPLICAÇÕES sheet (raw.explicacoes_*). The LEGENDA sheet only labels data origin
      (ITBI base / IPTU base / calculated) and is not ingested as field docs.
    columns:
      - name: n_cadastro_sql
        description: >-
          Number that uniquely identifies the property in the IPTU fiscal cadastre
          (Cadastro Imobiliário Fiscal). Declared by the taxpayer (N° do Cadastro / SQL).
          Staging keeps plain digit strings as-is (including leading zeros); Excel
          scientific notation (e.g. 2.6015E9) is expanded to a canonical digit string.
      - name: nome_logradouro
        description: >-
          Street name of the property address (street, alley, square, avenue, etc.).
          Filled automatically by the system from the SQL.
      - name: numero
        description: >-
          Property number on its street. Filled automatically by the system from the
          SQL (Número do Imóvel).
      - name: complemento
        description: >-
          Address complement for the property. Filled automatically by the system from
          the SQL (Complemento do Imóvel).
      - name: bairro
        description: >-
          Neighborhood of the property address. Filled automatically by the system from
          the SQL. Values are messy/unreliable in the ITBI source; planned enrichment
          joins stg_cep_aberto on normalized cep to replace or correct this field
          downstream (not in staging).
      - name: referencia
        description: >-
          Address reference for the property. IPTU-base field (not part of the DTI).
      - name: cep
        description: >-
          Postal code (CEP) of the street for the property address. Filled automatically
          by the system from the SQL. Staging normalizes to an 8-digit zero-padded
          string (e.g. 05093000). Join key for CEP Aberto enrichment.
      - name: natureza_transacao
        description: >-
          Type of legal transaction through which the property is being transferred
          (e.g. 1. Compra e venda). Declared by the taxpayer (Natureza da Transação).
      - name: valor_transacao_declarado_pelo_contribuinte
        description: >-
          Economic value given for acquiring the property (BRL). Declared by the
          taxpayer (Valor de Transação).
      - name: data_transacao
        description: >-
          Date of the private instrument or public deed that formalizes the legal
          transaction. Declared by the taxpayer; coerced from Excel serial/date in staging.
      - name: valor_venal_referencia
        description: >-
          Reference market value published by the Prefeitura; initial parameter for the
          ITBI tax base (BRL). Looked up by the system from the SQL and transaction date.
      - name: proporcao_transmitida
        description: >-
          Share of the property being transferred (percent). Declared by the taxpayer;
          100% when the entire property is transferred. Staging keeps the percent scale
          as-is (including tiny shares such as 0.01); values outside [0, 100] become null.
      - name: valor_venal_referencia_proporcional
        description: >-
          Reference market value × transmitted proportion (BRL). Compared to the
          transaction value to derive the tax base. System-calculated (LEGENDA:
          calculated field).
      - name: base_calculo_adotada
        description: >-
          ITBI tax base (BRL): the greater of transaction value and proportional
          reference market value. System-calculated.
      - name: tipo_financiamento
        description: >-
          Financing modality linked to the property acquisition. Declared by the
          taxpayer; optional; valid for transaction nature 1. Compra e venda.
      - name: valor_financiado
        description: >-
          Financing amount granted by a bank or financial institution for acquiring
          the property (BRL). Declared by the taxpayer; optional.
      - name: cartorio_registro
        description: >-
          Real-estate registry office responsible for the property's registration
          (matrícula or transcription). Declared by the taxpayer.
      - name: matricula_imovel
        description: >-
          Registration number (matrícula or transcription) of the transferred property.
          Declared by the taxpayer.
      - name: situacao_sql
        description: >-
          Whether the SQL is active or cancelled in the IPTU cadastre. IPTU-base field
          (not part of the DTI).
      - name: area_terreno_m2
        description: >-
          Land area in m². IPTU-base field (not part of the DTI).
      - name: testada_m
        description: >-
          Frontage length in meters facing the street. IPTU-base field; may be blank
          (more than two corners, internal lot, or landlocked lot).
      - name: fracao_ideal
        description: >-
          Share of the condominium land area attributed to each autonomous unit.
          IPTU-base field; 1.0000 when the property is not in a condominium.
      - name: area_construida_m2
        description: >-
          Built area in m² (not necessarily the occupied footprint). IPTU-base field
          (not part of the DTI).
      - name: uso_iptu
        description: >-
          Code for the property's predominant use. IPTU-base field; domain in Tabela
          de USOS. Staging normalizes Excel float-style codes (e.g. 20.0) to an
          integer-like string (20); non-numeric values become null.
      - name: descricao_uso_iptu
        description: >-
          Description of the property's predominant use, looked up from the use code
          via Tabela de USOS.
      - name: padrao_iptu
        description: >-
          Code for construction type and standard. IPTU-base field; domain in Tabela
          de PADRÕES. Staging normalizes Excel float-style codes (e.g. 11.0) to an
          integer-like string (11); non-numeric values become null.
      - name: descricao_padrao_iptu
        description: >-
          Description of construction type/standard, looked up from the code via
          Tabela de PADRÕES.
      - name: acc_iptu
        description: >-
          Corrected year construction was completed (may change after renovation,
          expansion, etc.). IPTU-base field (not part of the DTI).
      - name: _source_file
        description: Landing path relative to data/landing/ from ingest (e.g. itbi/2026.xlsx).
        data_tests:
          - not_null
      - name: _source_sheet
        description: Source month sheet name from ingest.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingest timestamp.
        data_tests:
          - not_null
      - name: _reference_month
        description: Payment / reference month derived at ingest (date).
        data_tests:
          - not_null
      - name: source_year
        description: Calendar year of the raw.itbi_YYYY table this row came from.
        data_tests:
          - not_null
          - accepted_values:
              # Keep in sync with vars.itbi_years in dbt_project.yml
              arguments:
                values: [2024, 2025, 2026]

  - name: stg_cep_aberto
    description: >-
      São Paulo CEP Aberto address reference (https://www.cepaberto.com/).
      Grain: one row per CEP. Staging normalizes CEP to the same 8-digit zero-padded
      string as stg_itbi for joins. Intended to fix/enrich messy ITBI bairro
      (neighborhood) values downstream via cep.
    columns:
      - name: cep
        description: >-
          Postal code normalized to an 8-digit zero-padded string (same as stg_itbi.cep).
        data_tests:
          - unique
          - not_null
      - name: logradouro
        description: Street / thoroughfare name from CEP Aberto.
      - name: complemento
        description: Address complement (e.g. odd/even side) from CEP Aberto.
      - name: bairro
        description: >-
          Neighborhood name from CEP Aberto. Preferred over ITBI bairro for enrichment.
      - name: id_cidade
        description: CEP Aberto city identifier.
        data_tests:
          - not_null
      - name: id_bairro
        description: CEP Aberto neighborhood identifier.
        data_tests:
          - not_null
      - name: _source_file
        description: Landing CSV path relative to data/landing/ from ingest.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingest timestamp.
        data_tests:
          - not_null

  - name: stg_ipca
    description: >-
      IBGE IPCA cumulative 12-month inflation rate series (from
      https://www.kaggle.com/datasets/hssiqueira/brazil-interest-rate-history-selic/data).
      Grain: one row per reference month. Headers slugified (Date → date;
      IPCA Rate (last 12 months) → ipca_rate_last_12_months); Date MM/YYYY
      coerced to first-of-month date.
    columns:
      - name: date
        description: >-
          Reference month as the first day of that month (from source MM/YYYY).
        data_tests:
          - unique
          - not_null
      - name: ipca_rate_last_12_months
        description: Cumulative IPCA rate over the trailing 12 months (percent).
        data_tests:
          - not_null
      - name: _source_file
        description: Landing CSV path relative to data/landing/ from ingest.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingest timestamp.
        data_tests:
          - not_null

  - name: stg_selic
    description: >-
      BACEN Copom / SELIC meta series (from
      https://www.kaggle.com/datasets/hssiqueira/brazil-interest-rate-history-selic/data).
      Grain: one row per Copom meeting date (data_reuniao_copom). Meeting numbers
      (numero_reuniao_copom) can repeat in early history. PascalCase headers
      slugified via CamelCase split (e.g. MetaSelic → meta_selic); timestamps and
      rates coerced in staging.
    columns:
      - name: numero_reuniao_copom
        description: >-
          Copom meeting number. Not unique in source for some early meetings;
          use data_reuniao_copom as the row grain.
        data_tests:
          - not_null
      - name: reuniao_extraordinaria
        description: Whether the meeting was extraordinary.
      - name: data_reuniao_copom
        description: Copom meeting timestamp (UTC); unique grain key.
        data_tests:
          - unique
          - not_null
      - name: vies
        description: Policy bias / vies text from BACEN (often n/a).
      - name: uso_meta_selic
        description: Whether the SELIC meta was in use for the period.
      - name: data_inicio_vigencia
        description: Start of SELIC meta validity (UTC).
      - name: data_fim_vigencia
        description: End of SELIC meta validity (UTC); null while current.
      - name: meta_selic
        description: SELIC target rate (percent per year).
      - name: taxa_tban
        description: TBAN rate when present.
      - name: taxa_selic_efetiva_vigencia
        description: Effective SELIC over the validity window.
      - name: taxa_selic_efetiva_anualizada
        description: Annualized effective SELIC rate.
      - name: descisao_monocratica_pres
        description: >-
          Monocratic presidential decision flag (source column typo
          descisaoMonocraticaPres preserved in slug).
      - name: _source_file
        description: Landing CSV path relative to data/landing/ from ingest.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Ingest timestamp.
        data_tests:
          - not_null

unit_tests:
  - name: test_stg_itbi_cast_fixtures
    description: >-
      Cast and normalize ITBI identifiers: leading-zero SQL preserved, scientific
      notation SQL expanded, uso/padrao float suffixes stripped, integer
      numero/matricula, and 8-digit zero-padded CEP. Fixtures mirror Portuguese
      raw headers; select_slugified_columns uses var('itbi_raw_columns') when the
      unit-test CTE is not introspectable. assert_itbi_schemas_match is stubbed.
      Cast logic in stg_itbi final select is under test.
    model: stg_itbi
    overrides:
      macros:
        assert_itbi_schemas_match: ""
    given:
      - input: source('raw', 'itbi_2024')
        format: sql
        fixture: stg_itbi_unit_test_cast_rows
      - input: source('raw', 'itbi_2025')
        format: sql
        fixture: stg_itbi_unit_test_empty
      - input: source('raw', 'itbi_2026')
        format: sql
        fixture: stg_itbi_unit_test_empty
    expect:
      format: dict
      rows:
        - nome_logradouro: fixture-street-a
          n_cadastro_sql: "012345678901234"
          numero: 42
          cep: "05093000"
          matricula_imovel: 987654
          uso_iptu: "10"
          padrao_iptu: null
          source_year: 2024
        - nome_logradouro: fixture-street-b
          n_cadastro_sql: "202400099"
          numero: 7
          cep: "05036001"
          matricula_imovel: 123456
          uso_iptu: "20"
          padrao_iptu: "11"
          source_year: 2024
        - nome_logradouro: fixture-street-sci
          n_cadastro_sql: "2601502142"
          numero: 1
          cep: "01001000"
          matricula_imovel: 1
          uso_iptu: "0"
          padrao_iptu: "0"
          source_year: 2024

  - name: test_stg_itbi_cep_invalid_becomes_null
    description: Non-numeric CEP literals (e.g. header leak) become null after staging.
    model: stg_itbi
    overrides:
      macros:
        assert_itbi_schemas_match: ""
    given:
      - input: source('raw', 'itbi_2024')
        format: sql
        fixture: stg_itbi_unit_test_invalid_cep
      - input: source('raw', 'itbi_2025')
        format: sql
        fixture: stg_itbi_unit_test_empty
      - input: source('raw', 'itbi_2026')
        format: sql
        fixture: stg_itbi_unit_test_empty
    expect:
      format: dict
      rows:
        - nome_logradouro: fixture-street-invalid-cep
          cep: null
          source_year: 2024

  - name: test_stg_itbi_drops_header_junk
    description: >-
      Rows that echo Portuguese column headers (natureza / situacao / financiamento)
      are filtered out; valid sibling rows are kept.
    model: stg_itbi
    overrides:
      macros:
        assert_itbi_schemas_match: ""
    given:
      - input: source('raw', 'itbi_2024')
        format: sql
        fixture: stg_itbi_unit_test_header_junk
      - input: source('raw', 'itbi_2025')
        format: sql
        fixture: stg_itbi_unit_test_empty
      - input: source('raw', 'itbi_2026')
        format: sql
        fixture: stg_itbi_unit_test_empty
    expect:
      format: dict
      rows:
        - nome_logradouro: fixture-street-keep
          natureza_transacao: "1.Compra e venda"
          source_year: 2024

  - name: test_stg_itbi_proporcao_range
    description: >-
      proporcao_transmitida keeps valid percent values (including tiny shares) and
      nulls values outside [0, 100].
    model: stg_itbi
    overrides:
      macros:
        assert_itbi_schemas_match: ""
    given:
      - input: source('raw', 'itbi_2024')
        format: sql
        fixture: stg_itbi_unit_test_proporcao
      - input: source('raw', 'itbi_2025')
        format: sql
        fixture: stg_itbi_unit_test_empty
      - input: source('raw', 'itbi_2026')
        format: sql
        fixture: stg_itbi_unit_test_empty
    expect:
      format: dict
      rows:
        - nome_logradouro: fixture-prop-full
          proporcao_transmitida: 100.0
          source_year: 2024
        - nome_logradouro: fixture-prop-tiny
          proporcao_transmitida: 0.01
          source_year: 2024
        - nome_logradouro: fixture-prop-absurd
          proporcao_transmitida: null
          source_year: 2024

  - name: test_stg_ipca_slugify
    description: >-
      Raw IPCA headers (Date, IPCA Rate (last 12 months)) become slugified
      aliases date and ipca_rate_last_12_months; MM/YYYY becomes first-of-month
      date. Fixture uses raw headers; select_slugified_columns uses
      var('ipca_raw_columns') when the unit-test CTE is not introspectable.
    model: stg_ipca
    given:
      - input: source('raw', 'ipca')
        format: sql
        fixture: stg_ipca_unit_test_slugify
    expect:
      format: dict
      rows:
        - date: "2024-01-01"
          ipca_rate_last_12_months: 4.51
          _source_file: ipca/IBGE_IPCA.csv

  - name: test_stg_selic_slugify
    description: >-
      PascalCase BACEN headers become snake_case via CamelCase-aware slugify
      (NumeroReuniaoCopom → numero_reuniao_copom, MetaSelic → meta_selic,
      descisaoMonocraticaPres → descisao_monocratica_pres). Fixture uses raw
      headers; select_slugified_columns uses var('selic_raw_columns') when the
      unit-test CTE is not introspectable.
    model: stg_selic
    given:
      - input: source('raw', 'selic')
        format: sql
        fixture: stg_selic_unit_test_slugify
    expect:
      format: dict
      rows:
        - numero_reuniao_copom: 280.0
          reuniao_extraordinaria: false
          vies: "n/a"
          uso_meta_selic: false
          meta_selic: 14.0
          descisao_monocratica_pres: false
          _source_file: selic/BACEN_SELIC.csv
