name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      - name: Seed DuckDB raw for dbt
        run: uv run python scripts/seed_ci_raw.py

      - name: dbt run
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt run -s stg_itbi

      - name: dbt test
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt test
